name: Test

on: push

permissions:
  contents: read

jobs:
  build:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Ansible Playbook
        run: ansible-playbook provision.yaml
