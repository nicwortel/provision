[defaults]
inventory = hosts.ini

[privilege_escalation]
# Ubuntu 26.04 defaults sudo to sudo-rs, whose password prompt ansible-core
# cannot parse. The issue below is closed, but the fix landed in devel only:
# the 2.21 backport (ansible/ansible#86905) is still unmerged, so the 2.21.2
# that Ubuntu ships needs the original sudo. Drop this on ansible-core 2.22.
# https://github.com/ansible/ansible/issues/85837
become_exe = sudo.ws
