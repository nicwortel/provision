---
# See https://launchpad.net/~ondrej/+archive/ubuntu/php and
# https://gist.github.com/roib20/27fde10af195cee1c1f8ac5f68be7e9b?permalink_comment_id=5112605#gistcomment-5112605
- name: Add PHP PPA
  deb822_repository:
    name: php
    types: [deb]
    uris: https://ppa.launchpadcontent.net/ondrej/php/ubuntu
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xb8dc7e53946656efbce4c1dd71daeaab4ad4cab6
    suites: [ "{{ ansible_facts['distribution_release'] }}" ]
    components: [ main ]
  become: true

- name: Install PHP packages
  ansible.builtin.apt:
    name: "{{ ['php'] | product(php_versions) | map('join', '') | product(php_extensions) | map('join', '-') }}"
    update_cache: yes
  become: true

# See https://getcomposer.org/doc/faqs/how-to-install-composer-programmatically.md
- name: Download the Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-installer.php
    checksum: sha384:https://composer.github.io/installer.sig

- name: Install Composer
  command: php /tmp/composer-installer.php --install-dir={{ ansible_env.HOME }}/.local/bin --filename=composer
  args:
    creates: ~/.local/bin/composer

# See https://github.com/phar-io/phive?tab=readme-ov-file#getting-phive
- name: Download PHIVE
  get_url:
    url: https://phar.io/releases/phive.phar
    dest: ~/.local/bin/phive
    mode: '755'
