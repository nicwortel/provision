---
# https://grafana.com/docs/k6/latest/set-up/install-k6/#debianubuntu
- name: Add repository
  deb822_repository:
    name: k6
    types: [ deb ]
    uris: https://dl.k6.io/deb
    suites: [ stable ]
    components: [ main ]
    signed_by: https://dl.k6.io/key.gpg
  become: true

- name: Install package
  ansible.builtin.apt:
    name: k6
    update_cache: yes
  become: true
