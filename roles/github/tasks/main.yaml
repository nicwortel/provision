---
# https://github.com/cli/cli/blob/trunk/docs/install_linux.md
- name: Add the apt repository
  deb822_repository:
    name: github
    types: [deb]
    uris: https://cli.github.com/packages
    suites: [ stable ]
    components: [ main ]
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    architectures: [ amd64 ]
  become: true

- name: Install gh package
  apt:
    name: gh
  become: true
