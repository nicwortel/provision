---
# https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
- name: Add the apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    components: [stable]
    architectures: [amd64]
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: true
  become: true

# https://docs.docker.com/engine/install/linux-postinstall
- name: Create the Docker group
  ansible.builtin.group:
    name: docker
  become: true

- name: Add the user to the Docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true

# Published ports are DNAT'd before INPUT, so ufw cannot filter them. Binding
# them to loopback keeps them off the LAN. Both keys are needed: "ip" covers
# only the default bridge, "default-network-opts" only the user-defined bridges
# compose creates, and it applies to networks created after this lands, so
# existing compose projects need recreating.
- name: Bind published container ports to loopback by default
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "ip": "127.0.0.1",
        "default-network-opts": {
          "bridge": {
            "com.docker.network.bridge.host_binding_ipv4": "127.0.0.1"
          }
        }
      }
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Docker
