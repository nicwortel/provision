---
# https://trivy.dev/docs/latest/getting-started/installation/#debianubuntu-official
- name: Add the apt repository
  deb822_repository:
    name: trivy
    types: [deb]
    uris: https://aquasecurity.github.io/trivy-repo/deb
    suites: [ generic ]
    components: [ main ]
    signed_by: https://aquasecurity.github.io/trivy-repo/deb/public.key
  become: true

- name: Install Trivy
  apt:
    name: trivy
    update_cache: yes
  become: true
